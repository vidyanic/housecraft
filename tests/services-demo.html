<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Plumbing and electrical layout preview</title><style>body{font:14px Arial;background:#f2f5f1;margin:12px}iframe{width:1440px;height:900px;border:1px solid #ccd4cb}button{padding:8px 16px;margin-bottom:10px}</style></head><body><h1>Plumbing and electrical layout</h1><p>Isolated sample: blue cold water, red hot water, green drain and amber electrical routes. Includes floor runs, wall risers and ceiling wiring.</p><button id="plan">Plan</button><button id="three">3D</button><iframe id="app" title="Service layout demonstration" src="../index.html?test=1"></iframe><script>
const frame=document.querySelector('#app');frame.onload=()=>{const A=frame.contentWindow.Atelier;const p=A.deep(A.DEFAULT);p.name='Plumbing & electrical sample';p.unit='cm';p.floors=[{id:'services-demo',name:'Service layout',elevation:0,rooms:[{id:'room-demo',type:'room',name:'Kitchen / utility',x:0,y:0,w:600,d:400,color:'#e9ebe2',ceilingHeight:300,floorMaterial:'Tile'}],walls:[{id:'wall-demo',type:'wall',x1:0,y1:0,x2:600,y2:0,height:300,thickness:15,color:'#d8dfd6'}],items:[],columns:[],beams:[],dimensions:[]}];p.activeFloor=0;p.camera.allFloors=false;p.camera.wallMode='cutaway';A.state.project=p;A.state.selected=null;A.state.selectedIds.clear();A.syncUI();
function add(type,x,y){A.addObjectToPlan(type,{x,y});return A.findEntity(A.state.selected);}
let cold=add('cold-water-pipe',50,60);A.setServicePath(cold,[{x:40,y:70,z:3},{x:250,y:70,z:3},{x:250,y:70,z:100},{x:430,y:70,z:100}]);cold.circuit='CW-01';
let hot=add('hot-water-pipe',50,90);A.setServicePath(hot,[{x:40,y:100,z:3},{x:270,y:100,z:3},{x:270,y:100,z:90},{x:430,y:100,z:90}]);
let drain=add('waste-pipe',100,230);A.setServicePath(drain,[{x:430,y:120,z:60},{x:430,y:120,z:5},{x:430,y:290,z:3},{x:100,y:290,z:0}]);
let wire=add('electrical-conduit',70,350);A.setServicePath(wire,[{x:60,y:350,z:30},{x:60,y:350,z:280},{x:60,y:40,z:280},{x:350,y:40,z:280},{x:350,y:210,z:280}]);wire.circuit='Lighting L1';
add('drain-sink',430,100);add('water-tap',430,68);add('mixer-tap',450,90);add('floor-drain',100,290);add('socket-point',60,350);add('switch-point',60,45);add('junction-box',60,40);add('light-point',350,210);A.select(cold.id);A.syncUI();A.fitPlan();A.state.history=[];A.state.future=[];
document.querySelector('#plan').onclick=()=>{A.setView('plan');A.fitPlan();A.select(cold.id);};document.querySelector('#three').onclick=()=>{A.setView('3d');A.fitPlan();};};
</script></body></html>
