<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Structural planning validation</title><style>body{margin:12px;font:14px system-ui;background:#edf2f3;color:#294352}button{padding:9px 15px;margin-right:7px}iframe{display:block;width:1440px;height:900px;border:1px solid #b6c7cc;margin-top:12px}</style></head><body><h1>Lucknow structural planning preview</h1><p>Isolated two-storey frame: explicit panels, aligned columns, connected beams and editable BIS design assumptions.</p><button id="desktop">Desktop</button><button id="tablet">Tablet</button><button id="mobile">Mobile</button><button id="plan">Structure plan</button><button id="elevation">Elevation</button><button id="three">3D</button><button id="calculate">Modal results</button><iframe id="app" title="Structural planning test sample" src="../index.html?test=1"></iframe><script>
const frame=document.querySelector('#app');frame.onload=()=>{const A=frame.contentWindow.Atelier,p=A.deep(A.DEFAULT);p.name='Lucknow structural sample';p.unit='cm';p.floors=[];p.activeFloor=0;p.camera.allFloors=true;p.camera.wallMode='cutaway';p.camera.roofMode='hidden';for(let level=0;level<2;level++){const id='level'+level,f={id,name:level?'First floor':'Ground floor',elevation:level*300,rooms:[],walls:[],items:[],columns:[],beams:[],dimensions:[],slabs:[{id:'panel'+level,type:'slab',name:'S'+(level+1),x:0,y:0,w:400,d:400,thickness:15,deadLoad:1,liveLoad:2}],loads:[],structuralWalls:[],grids:[]};for(const [i,x,y] of [[0,0,0],[1,400,0],[2,400,400],[3,0,400]])f.columns.push({id:id+'c'+i,type:'column',name:'Column '+(i+1),tag:'C'+(i+1),x:x-15,y:y-15,w:30,d:30,height:300,material:'M25',steelGrade:'Fe500',rebarSpec:'8-T16',footingWidth:150,footingDepth:150,baseSupport:'fixed'});for(let i=0;i<4;i++){const a=f.columns[i],b=f.columns[(i+1)%4],qa=A.structuralCenter(a),qb=A.structuralCenter(b);f.beams.push({id:id+'b'+i,type:'beam',tag:'B'+(i+1),name:'Beam '+(i+1),x1:qa.x,y1:qa.y,x2:qb.x,y2:qb.y,startColumnId:a.id,endColumnId:b.id,width:25,depth:40,material:'M25',steelGrade:'Fe500',cover:2.5,tieDiameter:.8,barDiameter:1.6,rebarSpec:'Top: 2-T16, Bottom: 2-T16',supportCondition:'continuous'});}for(const [i,axis,position] of [[0,'x',0],[1,'x',400],[2,'y',0],[3,'y',400]])f.grids.push({id:id+'g'+i,type:'grid',name:axis==='x'?String.fromCharCode(65+i):String(i-1),axis,position});p.floors.push(f);}A.state.project=A.normalizeProject(p);A.state.selected=null;A.state.selectedIds.clear();A.state.history=[];A.state.future=[];A.setWorkspace('structure');A.syncUI();A.fitPlan();for(const [name,width,height] of [['desktop',1440,900],['tablet',820,900],['mobile',390,844]])document.querySelector('#'+name).onclick=()=>{frame.style.width=width+'px';frame.style.height=height+'px';};document.querySelector('#plan').onclick=()=>{A.state.structDrawingView='plan';A.setWorkspace('structure');A.fitPlan();};document.querySelector('#elevation').onclick=()=>{A.state.structDrawingView='elevation';A.setWorkspace('structure');A.fitPlan();};document.querySelector('#three').onclick=()=>{A.setView('3d');A.fitPlan();};document.querySelector('#calculate').onclick=()=>{A.state.structuralReport=A.engineeringReport(A.state.project,true);A.setWorkspace('structure');A.renderInspector();};};
</script></body></html>
