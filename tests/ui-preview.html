<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Atelier Plan · Studio UI preview</title>
<style>body{margin:12px;font:13px system-ui;background:#edf1f4;color:#243846}h1{font-size:19px;margin:0 0 8px}p{color:#647785}button{padding:8px 14px;margin:0 4px 6px 0;border:1px solid #cad8e1;background:white;border-radius:5px;cursor:pointer}iframe{display:block;border:1px solid #cbd8e0;width:1440px;height:900px;margin-top:4px}</style>
<h1>Atelier Plan · redesigned studio</h1><p>Isolated preview: desktop, tablet and touch layouts. The saved working project is preserved.</p>
<button id="desktop">Desktop</button><button id="tablet">Tablet</button><button id="mobile">Mobile</button><button id="architecture">Architecture</button><button id="structure">Structure</button><button id="services">Services</button><button id="three">3D</button><button id="edit">Select furniture</button><button id="properties">Properties</button><button id="library">Library</button><button id="objects">Objects</button><button id="export">Export</button>
<button id="wallWarning">Wall alignment warning</button>
<button id="stairPreview">Three-sided stair</button><button id="semiLPreview">Semi L + U stair stack</button>
<iframe id="app" title="Redesigned studio preview" src="../index.html?test=1"></iframe>
<script>
const frame=document.getElementById('app');
frame.onload=()=>{const A=frame.contentWindow.Atelier;A.state.project=A.normalizeProject(A.deep(A.DEFAULT));A.state.project.name='Courtyard house';A.state.selected=null;A.state.selectedIds.clear();A.state.history=[];A.state.future=[];A.setWorkspace('architecture');A.syncUI();A.fitPlan();if(new URLSearchParams(location.search).get('stair')==='semi-l')document.getElementById('semiLPreview').click();};
for(const [name,width,height] of [['desktop',1440,900],['tablet',820,900],['mobile',390,844]])document.getElementById(name).onclick=()=>{frame.style.width=width+'px';frame.style.height=height+'px';requestAnimationFrame(()=>{const A=frame.contentWindow.Atelier;A.resizeCanvas();A.fitPlan();});};
for(const name of ['architecture','structure','services'])document.getElementById(name).onclick=()=>frame.contentWindow.Atelier.setWorkspace(name);
document.getElementById('three').onclick=()=>frame.contentWindow.Atelier.setView('3d');
document.getElementById('stairPreview').onclick=()=>{const A=frame.contentWindow.Atelier,p=A.deep(A.DEFAULT);p.name='11 ft 6 in × 9 ft 6 in stair';p.floors=[{id:'stair-preview-floor',name:'Stair room',elevation:0,rooms:[{id:'stair-room',type:'room',name:'Stair room · clear dimensions',x:0,y:0,w:350.52,d:289.56,ceilingHeight:304.8,color:'#eee7d9',floorMaterial:'Concrete'}],walls:[],items:[],dimensions:[],columns:[],beams:[]}];p.activeFloor=0;p.site.width=350.52;p.site.depth=289.56;p.builtUp.width=350.52;p.builtUp.depth=289.56;p.camera.wallMode='hidden';A.state.project=A.normalizeProject(p);A.state.history=[];A.state.future=[];A.setWorkspace('architecture');A.addObjectToPlan('three-side-stairs',{x:175.26,y:144.78});const o=A.findEntity(A.state.selected);o.x=0;o.y=0;o.stairStartSide='long';o.stairHandedness='right';A.connectStairUpper(o.id);A.continueStairUp(o.id);A.state.project.camera.allFloors=true;A.viewStairFloor(A.state.project.floors[0].id,o.id);A.studioUI.showPanel('inspector');};
document.getElementById('semiLPreview').onclick=()=>{
 const A=frame.contentWindow.Atelier,p=A.deep(A.DEFAULT),floor=(id,name,elevation)=>({id,name,elevation,rooms:[],walls:[],items:[],dimensions:[],columns:[],beams:[]});
 p.name='Ground Semi L to first-floor U stair';p.floors=[floor('semi-ground','Ground floor · long entrance',0),floor('semi-first','First floor · compact U stair',304.8)];p.activeFloor=1;p.site.width=700;p.site.depth=420;p.builtUp.width=700;p.builtUp.depth=420;p.camera.wallMode='hidden';
 const upper={...A.deep(A.CATALOG.find(o=>o.type==='three-side-stairs')),id:'semi-upper-u',x:250,y:60,rotation:0,elevation:0};p.floors[1].items.push(upper);
 for(const f of p.floors)f.rooms.push({id:'room-'+f.id,type:'room',name:f.name,x:f.elevation?250:40,y:60,w:f.elevation?350.52:560.52,d:289.56,ceilingHeight:304.8,color:'#eee7d9',floorMaterial:'Concrete'});
 A.state.project=A.normalizeProject(p);A.state.history=[];A.state.future=[];A.state.selected=null;A.state.selectedIds.clear();A.setWorkspace('architecture');A.syncUI();A.select(upper.id);A.addSemiLStairBelow(upper.id);Object.assign(A.state.project.camera,{yaw:-38,pitch:34,zoom:.56,allFloors:true});A.studioUI.showPanel('inspector');
};
document.getElementById('wallWarning').onclick=()=>{const A=frame.contentWindow.Atelier,p=A.deep(A.DEFAULT);p.name='Wall alignment warning';p.activeFloor=0;p.floors=[{id:'warning-floor',name:'Wall correction',elevation:0,rooms:[],items:[],dimensions:[],columns:[],beams:[],walls:[{id:'warning-a',name:'Top wall',type:'wall',x1:0,y1:0,x2:500,y2:0,thickness:10,height:280},{id:'warning-b',name:'Right wall',type:'wall',x1:500,y1:0,x2:500,y2:400,thickness:10,height:280},{id:'warning-c',name:'Diagonal wall',type:'wall',x1:500,y1:400,x2:0,y2:0,thickness:10,height:280}]}];A.state.project=A.normalizeProject(p);A.state.history=[];A.state.future=[];A.state.selected=null;A.state.selectedIds.clear();A.setWorkspace('architecture');A.syncUI();A.fitPlan();A.squareWalls();};
document.getElementById('edit').onclick=()=>{const A=frame.contentWindow.Atelier;A.setWorkspace('architecture');A.select(A.floor().items.find(o=>o.shape==='bed')?.id||A.floor().items[0]?.id);A.studioUI.showPanel('inspector');};
for(const name of ['properties','library','objects','export'])document.getElementById(name).onclick=()=>{const A=frame.contentWindow.Atelier;if(name==='properties')A.studioUI.showPanel('inspector');else if(name==='export')A.studioUI.openExport();else A.studioUI.showLibrary(name);};
</script></html>
