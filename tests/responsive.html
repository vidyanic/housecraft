<!doctype html><html lang="en"><meta charset="utf-8"><title>Atelier Plan responsive preview</title><style>body{margin:12px;font:14px system-ui;background:#f3f5f1}button{padding:8px 16px;margin-right:8px}iframe{display:block;border:1px solid #bbb;margin-top:12px;width:1440px;height:900px}</style><h1>Responsive browser preview</h1><p id="dimensions">Desktop · 1440 × 900</p><button id="desktop">Desktop</button><button id="mobile">Mobile</button><button id="tablet">Tablet</button><iframe id="app" title="Atelier Plan responsive preview" src="../index.html?test=1"></iframe><script>for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844],['tablet',820,900]])document.getElementById(name).onclick=()=>{const frame=document.getElementById('app');frame.style.width=width+'px';frame.style.height=height+'px';document.getElementById('dimensions').textContent=name+' · '+width+' × '+height;};</script></html>
